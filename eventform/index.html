<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket</title>
    <link rel="icon" href="favicon.png" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css"
        integrity="sha512-oHDEc8Xed4hiW6CxD7qjbnI+B07vDdX7hEPTvn9pSZO1bcRqHp8mj9pyr+8RVC2GmtEfI2Bi9Ke9Ass0as+zpg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-wrapper">
        <div class="ticket-layout">
            <section class="ticket-front">
                <h1>Event Ticket</h1>
                <form id="eventForm" novalidate>
                    <div class="field">
                        <label for="firstName">First Name</label>
                        <input id="firstName" name="firstName" type="text" required>
                    </div>
                    <div class="field">
                        <label for="lastName">Last Name</label>
                        <input id="lastName" name="lastName" type="text" required>
                    </div>
                    <div class="field full">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" required>
                    </div>
                    <div class="field">
                        <label for="type">Type</label>
                        <select id="type" name="type" required>
                            <option value="">Choose one</option>
                            <option value="student">Student</option>
                            <option value="guest">Guest</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="eventDate">Event Date</label>
                        <input id="eventDate" name="eventDate" type="date" required>
                    </div>
                    <div class="field full" id="studentField" hidden>
                        <label for="studentId">Student I#</label>
                        <input id="studentId" name="studentId" type="text"
                            inputmode="numeric" minlength="9" maxlength="9"
                            pattern="[0-9]{9}" title="Enter exactly 9 digits, no more, no less.">
                    </div>
                    <div class="field full" id="guestField" hidden>
                        <label for="accessCode">Access Code</label>
                        <input id="accessCode" name="accessCode" type="text"
                            minlength="8" maxlength="8" pattern="EVENT131"
                            title="oh wow, you found this. The code is: EVENT131">
                    </div>
                    <button class="full" type="submit">Create Ticket</button>
                </form>
                <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
            </section>
            <section id="ticketResult" class="ticket-back" aria-live="polite" hidden>
                <h2>Ticket Created</h2>
                <p id="resultName"></p>
                <p id="resultType"></p>
                <p id="resultDate"></p>
            </section>
        </div>
    </main>
</body>
</html>
